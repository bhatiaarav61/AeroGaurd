<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AeroGuard Pro — Settings</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 14px/1.6 system-ui; max-width: 700px; margin: 0 auto; padding: 24px; background: #f5f5f5; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 24px; color: #1a1a2e; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #333; }
    .setting { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .setting:last-child { border-bottom: none; }
    .setting-info h3 { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .setting-info p { font-size: 12px; color: #888; }
    .switch { position: relative; width: 48px; height: 26px; flex-shrink: 0; margin-left: 16px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #ddd; border-radius: 26px; transition: .3s; }
    .slider:before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; box-shadow: 0 2px 4px rgba(0,0,0,.15); }
    input:checked + .slider { background: #667eea; }
    input:checked + .slider:before { transform: translateX(22px); }
    select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; background: white; font-size: 13px; min-width: 200px; }
    .list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .list-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; font-size: 13px; }
    .list-item input { flex-shrink: 0; }
    .list-meta { font-size: 11px; color: #888; margin-left: auto; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #667eea; color: white; }
    .btn-secondary { background: #eee; color: #333; }
    .btn-danger { background: #fee; color: #c00; }
    .actions { display: flex; gap: 12px; margin-top: 20px; }
    .custom-rule { display: flex; gap: 8px; margin-bottom: 8px; }
    .custom-rule input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>⚙️ AeroGuard Pro Settings</h1>

  <div class="card">
    <h2>General</h2>
    <div class="setting">
      <div class="setting-info">
        <h3>Enable Protection</h3>
        <p>Master toggle for all blocking</p>
      </div>
      <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
    </div>
    <div class="setting">
      <div class="setting-info">
        <h3>YouTube Mode</h3>
        <p>Aggressive = Network + Player patch + IMA block</p>
      </div>
      <select id="ytMode">
        <option value="basic">Basic (Network only)</option>
        <option value="standard">Standard (+Player patch)</option>
        <option value="aggressive">Aggressive (+IMA block)</option>
      </select>
    </div>
  </div>

  <div class="card">
    <h2>Filter Lists (15 Premium Lists)</h2>
    <div class="list-grid" id="listGrid"></div>
  </div>

  <div class="card">
    <h2>Custom Rules</h2>
    <div id="customRules"></div>
    <div class="custom-rule">
      <input type="text" id="newRulePattern" placeholder="||example.com^" title="ABP format">
      <select id="newRuleAction"><option value="block">Block</option><option value="allow">Allow</option></select>
      <button class="btn btn-primary" id="addRule">Add</button>
    </div>
  </div>

  <div class="card">
    <h2>Data</h2>
    <div class="actions">
      <button class="btn btn-secondary" id="exportBtn">Export Settings</button>
      <button class="btn btn-secondary" id="importBtn">Import Settings</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
      <button class="btn btn-danger" id="resetBtn">Reset All</button>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
