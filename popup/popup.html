<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
        </svg>
      </div>
      <div class="title-section">
        <h1>AeroGuard</h1>
        <span class="version">v1.0.0</span>
      </div>
    </header>

    <main class="popup-main">
      <section class="section main-toggle-section">
        <div class="toggle-wrapper">
          <div class="toggle-info">
            <span class="toggle-label">Protection</span>
            <span class="toggle-status" id="toggleStatus">Active</span>
          </div>
          <button class="toggle-switch" id="mainToggle" aria-label="Toggle ad blocker">
            <span class="toggle-thumb"></span>
          </button>
        </div>
      </section>

      <section class="section site-toggle-section">
        <div class="toggle-wrapper">
          <div class="toggle-info">
            <span class="toggle-label">On this site</span>
            <span class="toggle-status" id="siteToggleStatus">Enabled</span>
          </div>
          <button class="toggle-switch" id="siteToggle" aria-label="Toggle for this site">
            <span class="toggle-thumb"></span>
          </button>
        </div>
      </section>

      <section class="section stats-section">
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-value" id="blockedCount">0</span>
            <span class="stat-label">Blocked</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="trackersBlocked">0</span>
            <span class="stat-label">Trackers</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="adsBlocked">0</span>
            <span class="stat-label">Ads</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="malwareBlocked">0</span>
            <span class="stat-label">Malware</span>
          </div>
        </div>
      </section>

      <section class="section actions-section">
        <div class="action-buttons">
          <button class="action-btn" id="elementPickerBtn" title="Pick element to block">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
              <path d="M13 13l6 6"/>
            </svg>
            <span>Block Element</span>
          </button>
          <button class="action-btn" id="reportIssueBtn" title="Report unblocked ad">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span>Report Ad</span>
          </button>
        </div>
      </section>

      <section class="section filter-lists-section">
        <h3>Filter Lists</h3>
        <div class="filter-list-items" id="filterLists"></div>
        <button class="btn-link" id="updateListsBtn">Update Lists</button>
      </section>

      <section class="section site-info-section">
        <div class="site-info">
          <span class="site-icon" id="siteIcon"></span>
          <div class="site-details">
            <span class="site-name" id="siteName">Loading...</span>
            <span class="site-url" id="siteUrl"></span>
          </div>
        </div>
      </section>
    </main>

    <footer class="popup-footer">
      <button class="footer-btn" id="optionsBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </button>
      <button class="footer-btn" id="helpBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span>Help</span>
      </button>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
