<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      fill: #38bdf8;
    }
    .title {
      font-weight: 700;
      font-size: 16px;
      color: #38bdf8;
    }
    .badge {
      margin-left: auto;
      font-size: 11px;
      background: #1e293b;
      color: #4ade80;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 14px;
      border: 1px solid #334155;
    }
    .stat-number {
      font-size: 26px;
      font-weight: 800;
      color: #38bdf8;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <!-- Embedded SVG Logo (Guaranteed to Never Disappear) -->
    <svg class="logo-icon" viewBox="0 0 24 24">
      <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/>
    </svg>
    <div class="title">AeroGuard</div>
    <div class="badge">Protected</div>
  </div>

  <div class="stat-card">
    <div class="stat-number" id="blockedCount">Active</div>
    <div class="stat-label">Ultra-DNR Rules Engine</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const rules = await chrome.declarativeNetRequest.getDynamicRules();
        document.getElementById('blockedCount').textContent = rules.length + " Rules";
      } catch (e) {
        document.getElementById('blockedCount').textContent = "Active";
      }
    });
  </script>
</body>
</html>
