<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AeroGuard Icon Generator</title>
  <style>
    body { font-family: system-ui; padding: 20px; background: #0f172a; color: #f8fafc; }
    .icon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }
    .icon-item { text-align: center; }
    canvas { border: 2px solid #334155; border-radius: 8px; background: #0f172a; }
    button { padding: 12px 24px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 16px; }
    button:hover { background: #0ea5e9; }
    h1 { color: #38bdf8; }
  </style>
</head>
<body>
  <h1>AeroGuard Icon Generator</h1>
  <p>Click "Generate All Icons" to create PNG files, then right-click each canvas → "Save image as..."</p>
  <button onclick="generateAll()">Generate All Icons</button>
  <div class="icon-grid" id="icons"></div>

  <script>
    function drawIcon(ctx, size) {
      // Background
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, size, size);

      // Shield shape
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(size/2, size*0.04);
      ctx.lineTo(size*0.125, size*0.21);
      ctx.lineTo(size*0.125, size*0.71);
      ctx.bezierCurveTo(size*0.125, size*0.94, size*0.5, size*0.98, size/2, size*0.96);
      ctx.bezierCurveTo(size*0.875, size*0.98, size*0.875, size*0.94, size*0.875, size*0.71);
      ctx.lineTo(size*0.875, size*0.21);
      ctx.closePath();
      ctx.fill();

      // Inner accent
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.moveTo(size/2, size*0.12);
      ctx.lineTo(size*0.3, size*0.3);
      ctx.lineTo(size*0.3, size*0.62);
      ctx.bezierCurveTo(size*0.3, size*0.8, size/2, size*0.85, size/2, size*0.83);
      ctx.bezierCurveTo(size*0.7, size*0.85, size*0.7, size*0.8, size*0.7, size*0.62);
      ctx.lineTo(size*0.7, size*0.3);
      ctx.closePath();
      ctx.fill();
    }

    function generateAll() {
      const container = document.getElementById('icons');
      container.innerHTML = '';
      const sizes = [16, 32, 48, 128];

      sizes.forEach(size => {
        const div = document.createElement('div');
        div.className = 'icon-item';

        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        drawIcon(ctx, size);

        const label = document.createElement('div');
        label.textContent = `${size}x${size}`;
        label.style.marginTop = '8px';
        label.style.color = '#94a3b8';

        const downloadBtn = document.createElement('button');
        downloadBtn.textContent = `Save ${size}x${size}.png`;
        downloadBtn.style.marginTop = '8px';
        downloadBtn.onclick = () => {
          const link = document.createElement('a');
          link.download = `icon-${size}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        };

        div.appendChild(canvas);
        div.appendChild(label);
        div.appendChild(downloadBtn);
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
