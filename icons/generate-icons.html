<!DOCTYPE html>
<html>
<head><title>Generate Icons</title>
<style>
  body { font-family: system-ui; padding: 20px; max-width: 600px; margin: 0 auto; }
  canvas { border: 1px solid #ddd; margin: 10px 0; background: #f0f0f0; }
  button { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 5px; }
  button:hover { background: #5568d3; }
</style>
</head>
<body>
  <h1>Generate AeroGuard Icons</h1>
  <p>Click "Generate All" then right-click each canvas → "Save image as..." to icons/ folder</p>
  <button onclick="generateAll()">Generate All Sizes</button>
  <div id="sizes"></div>
  <script>
    const sizes = [16, 32, 48, 128];
    function drawIcon(ctx, size) {
      const cx = size/2, cy = size/2, r = size * 0.38;
      // Shield background
      ctx.beginPath();
      ctx.moveTo(cx, cy - r);
      ctx.bezierCurveTo(cx + r, cy - r, cx + r, cy + r * 0.5, cx, cy + r);
      ctx.bezierCurveTo(cx - r, cy + r * 0.5, cx - r, cy - r, cx, cy - r);
      ctx.fillStyle = 'linear-gradient(135deg, #667eea, #764ba2)';
      ctx.fill();
      // Checkmark
      ctx.strokeStyle = 'white';
      ctx.lineWidth = size * 0.1;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.35, cy);
      ctx.lineTo(cx - r * 0.05, cy + r * 0.3);
      ctx.lineTo(cx + r * 0.4, cy - r * 0.35);
      ctx.stroke();
      // Wings
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath();
      ctx.ellipse(cx - r * 0.5, cy, r * 0.25, r * 0.4, -Math.PI/4, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + r * 0.5, cy, r * 0.25, r * 0.4, Math.PI/4, 0, Math.PI*2);
      ctx.fill();
    }
    function generateAll() {
      const container = document.getElementById('sizes');
      container.innerHTML = '';
      sizes.forEach(size => {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        drawIcon(ctx, size);
        const label = document.createElement('div');
        label.textContent = `${size}x${size}px`;
        label.style.marginTop = '8px';
        const btn = document.createElement('button');
        btn.textContent = `Download ${size}px`;
        btn.onclick = () => {
          const link = document.createElement('a');
          link.download = `icon-${size}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        };
        container.append(canvas, label, btn, document.createElement('hr'));
      });
    }
  </script>
</body>
</html>
